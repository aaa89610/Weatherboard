name: 抓取原始資料

# 備援用，不排程。正常情況下抓取與判讀都在 Claude session 內完成。
# 2026-09-21 起：環境白名單放寬後 Claude 自己就連得到氣象署，這支因此退為備援。
# Claude 端連續失敗時，到 Actions 手動 Run workflow 可產生一筆快照
# （只寫 data/v2/，不產生報告，也不觸發部署）。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install --quiet requests pillow

      # 一站都沒抓到會回非 0，job 紅燈，不會寫出空快照。
      # log 會印出站碼比對方式（6碼／5碼／混合）與命中站數。
      # CWA_KEY 有值就走開放資料 API（欄位有名稱、附 ObsTime）；
      # 沒有或 API 失敗就自動退回爬網頁，不會因此中斷。
      - name: 抓取並做空間分析
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
        run: python analyze/fetch_v2.py

      - name: 提交快照
        run: |
          git config user.name  "Weatherboard Bot"
          git config user.email "aaa89610@users.noreply.github.com"
          git add data/v2
          if git diff --cached --quiet; then
            echo "無新快照，略過 commit"
          else
            git commit -m "原始快照 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push || (git pull --rebase && git push)
          fi

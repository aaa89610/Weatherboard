name: 抓取原始資料

# GitHub 只負責「抓」：跑 analyze/fetch_v2.py 抓測站與預報、做空間分析，
# 寫成 data/v2/<stamp>.json 後 push。判讀由 Claude 讀 data/ 之後另外做。
# 這裡不產生報告，也不觸發部署（deploy.yml 的 paths 不含 data/）。
on:
  schedule:
    # 台灣時間 07,09,11,13,15,17,19,21 → UTC 23,01,03,05,07,09,11,13
    - cron: '5 23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install --quiet requests pillow

      # 一站都沒抓到會回非 0，job 紅燈，不會寫出空快照。
      # log 會印出站碼比對方式（6碼／5碼／混合）與命中站數。
      - name: 抓取並做空間分析
        run: python analyze/fetch_v2.py

      - name: 提交快照
        run: |
          git config user.name  "Weatherboard Bot"
          git config user.email "aaa89610@users.noreply.github.com"
          git add data/v2
          if git diff --cached --quiet; then
            echo "無新快照，略過 commit"
          else
            git commit -m "原始快照 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push || (git pull --rebase && git push)
          fi

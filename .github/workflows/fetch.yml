name: 抓取原始資料

# 保留但不排程 —— 定時的資料收集現在由 Claude 做(見 README 架構)。
# 這支留著是因為它能直接打氣象署端點,拿到逐時、QPF、雨量站等搜尋拿不到的細粒度資料。
# 需要那種解析度時,到 Actions 手動 Run workflow 產生一筆原始快照即可。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install --quiet requests pillow

      # 全部來源都失敗時會回非 0,job 直接紅燈,不會寫出空快照
      - name: 抓取原始資料
        run: python build_board.py --fetch-only

      - name: 提交原始快照
        run: |
          git config user.name  "Weatherboard Bot"
          git config user.email "aaa89610@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "無新快照,略過 commit"
          else
            git commit -m "原始快照 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push || (git pull --rebase && git push)
          fi

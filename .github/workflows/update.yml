name: 更新降雨看板

on:
  schedule:
    # 台灣時間 07,09,11,13,15,17,19,21 → UTC 23,01,03,05,07,09,11,13
    # GitHub 的排程是「盡力而為」，尖峰時段可能延遲數分鐘到數十分鐘
    - cron: '5 23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:        # 允許在 Actions 頁面手動按下執行

permissions:
  contents: write           # 推回 data.json / index.html / history
  pages: write              # 部署 GitHub Pages
  id-token: write           # 部署 GitHub Pages 用的 OIDC

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install --quiet requests pillow

      - name: 抓資料並產生看板
        run: python build_board.py

      - name: 提交更新
        run: |
          git config user.name  "Weatherboard Bot"
          git config user.email "aaa89610@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "資料無變動，略過 commit"
          else
            git commit -m "自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push || (git pull --rebase && git push)
          fi

      - name: 打包網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

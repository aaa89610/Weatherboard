name: 部署看板

# GitHub 只負責部署:資料抓取與分析在 Claude session 內完成後 push,
# 這裡收到 push 就把當前內容發布到 GitHub Pages。
on:
  push:
    branches: [main]
    # 只有看板本身變動才部署;抓取 job 推的原始快照不需要重新發布
    paths: ['report.html', 'index.html', 'data.json', 'template.html', '.nojekyll']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 打包網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

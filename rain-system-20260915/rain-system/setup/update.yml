name: 更新降雨看板

on:
  schedule:
    # 台灣時間 07,09,11,13,15,17,19,21 → UTC 23,01,03,05,07,09,11,13
    - cron: '5 23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python build_board.py
      - name: commit
        run: |
          git config user.name  "Weatherboard Bot"
          git config user.email "aaa89610@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
